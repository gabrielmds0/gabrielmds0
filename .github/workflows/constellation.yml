name: Contribution sky

on:
  schedule:
    - cron: "17 6 * * *" # daily, 03:17 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/constellation.yml]

permissions:
  contents: write

concurrency:
  group: constellation
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render assets/constellation.svg
        run: node scripts/constellation.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Commit if the sky changed
        run: |
          git diff --quiet -- assets/constellation.svg README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/constellation.svg README.md
          git commit -m "chore: update contribution sky"
          git push
